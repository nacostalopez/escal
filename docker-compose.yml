services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-escal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-escal}
      POSTGRES_DB: ${POSTGRES_DB:-escal}
    ports:
      - "5432:5432"
    volumes:
      - escal_db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-escal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-escal}:${POSTGRES_PASSWORD:-escal}@db:5432/${POSTGRES_DB:-escal}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

volumes:
  escal_db_data:
